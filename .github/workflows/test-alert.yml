name: test alert
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: state
          key: chat-x
          restore-keys: chat-
      - run: pip install requests && python -u bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TEST_QUERY: "MJRR4X/A,MJRP4X/A"
          TEST_MATCH: "iPhone 18 Pro 256GB"
          ANNOUNCE: "0"
          RUN_MINUTES: "1"
