name: iPhone stock tracker

on:
  schedule:
    - cron: "*/30 * * * *"   # backup only; each run also queues the next one itself
  workflow_dispatch:
    inputs:
      announce:
        description: "Send a 'tracker updated' message"
        default: "0"
      minutes:
        description: "Minutes to run"
        default: "340"

concurrency:
  group: tracker
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Queue the next run (starts as soon as this one ends)
        if: github.event.inputs.minutes == '' || github.event.inputs.minutes == '340'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run tracker.yml -R ${{ github.repository }} -f announce=0 -f minutes=340 || true

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Restore saved chat id
        uses: actions/cache/restore@v4
        with:
          path: state
          key: chat-${{ github.run_id }}
          restore-keys: chat-

      - name: Track
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANNOUNCE: ${{ github.event.inputs.announce }}
          RUN_MINUTES: ${{ github.event.inputs.minutes || '340' }}
        shell: bash
        run: |
          set +e
          python -u bot.py 2>&1 | tee out.log
          code=${PIPESTATUS[0]}
          tail -n 8 out.log | tr -d '\r' | while IFS= read -r l; do echo "::notice::$l"; done
          exit $code

      - name: Save chat id
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: chat-${{ github.run_id }}
