name: iPhone stock tracker

on:
  schedule:
    - cron: "*/30 * * * *"   # queues a new run; it starts as soon as the current one ends
  workflow_dispatch:
    inputs:
      announce:
        description: "Send a 'tracker is live' message"
        default: "1"
      minutes:
        description: "Minutes to run"
        default: "340"

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Restore saved chat id
        uses: actions/cache/restore@v4
        with:
          path: state
          key: chat-${{ github.run_id }}
          restore-keys: chat-

      - name: Track
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANNOUNCE: ${{ github.event.inputs.announce }}
          RUN_MINUTES: ${{ github.event.inputs.minutes || '340' }}
        shell: bash
        run: |
          set +e
          python -u bot.py 2>&1 | tee out.log
          code=${PIPESTATUS[0]}
          tail -n 8 out.log | tr -d '\r' | while IFS= read -r l; do echo "::notice::$l"; done
          exit $code

      - name: Save chat id
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: chat-${{ github.run_id }}
